plugins {
    id('java')
    id 'dev.architectury.loom' version '1.17-SNAPSHOT' apply(false)
    id 'com.gradleup.shadow' version '9.5.1'
    id("com.hypherionmc.modutils.modpublisher") version "2.2.1"
}

configurations {
    // 送入 shadowJar 做 relocate 处理的依赖
    shade {
        canBeResolved = true
        canBeConsumed = false
    }
    // 重定位后的 GraalJS 完整 jar，供 :common 与各加载器项目消费
    transformedBundle {
        canBeResolved = false
        canBeConsumed = true
    }
}

dependencies {
    shade("org.graalvm.polyglot:polyglot:${graaljs_version}")
    shade("org.graalvm.polyglot:js:${graaljs_version}") {
        exclude(group: "org.graalvm.shadowed", module: "icu4j")
        exclude(group: "org.graalvm.truffle", module: "truffle-enterprise")
        exclude(group: "org.graalvm.sdk", module: "nativeimage")
    }
}

shadowJar {
    configurations = [project.configurations.shade]
    archiveClassifier = 'dev-shadow'

    dependencies {
        // exclude the pom
        exclude(dependency("org.graalvm.js:js"))
    }

    // icu4j removed
    relocate("org.graalvm.shadowed.com.ibm.icu", "com.ibm.icu")
    // certain `org.graalvm.xxxx` jars are bundled in GraalVM (JVM), relocate to prevent conflict
    relocate("org.graalvm", "graal.graalvm")
    relocate("com.oracle.svm", "graal.svm")

    duplicatesStrategy = DuplicatesStrategy.WARN
    mergeServiceFiles()
}

// 把重定位后的 GraalJS jar 作为 `transformed` 供其他项目消费
artifacts {
    transformedBundle(tasks.shadowJar)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    url = "https://repo.spongepowered.org/maven/"
                }
            }
            filter {
                includeGroup "org.spongepowered"
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    url = "https://cursemaven.com"
                }
            }
            filter {
                includeGroup "curse.maven"
            }
        }
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()
    }
}

// exclude `common` project
configure(subprojects.findAll { it.name != 'common' }) {
    apply plugin: 'dev.architectury.loom'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    tasks.register("prodClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
        mods.from(remapJar.archiveFile)

        jvmArgs.add("-Xmx1G")

        runDir = file("run")
    }

    tasks.register("buildAndCollect", Copy) {
        it.from(remapJar.archiveFile)
        it.into(rootProject.file("./build/libs"))
    }
}