import java.util.function.BiConsumer

plugins {
    id 'com.gradleup.shadow'
    id("com.hypherionmc.modutils.modpublisher")
}

configurations {
    // common 模块与重定位后的 GraalJS：编译/运行期可见，同时被打进最终 mod jar。
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    var shade = create("shade")
    implementation.extendsFrom(shade)
    developmentFabric.extendsFrom(shade)
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

loom {
    silentMojangMappingsLicense()
}

dependencies {
    minecraft "net.minecraft:minecraft:$minecraft_version"
    mappings loom.officialMojangMappings()

    modImplementation("net.fabricmc:fabric-loader:$fabric_loader_version")

    shade(project(':common')) { transitive = false }
    shade(project(path: ':', configuration: 'transformedBundle')) { transitive = false }

    testImplementation("net.fabricmc:fabric-loader-junit:${fabric_loader_version}")
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', mod_version

    filesMatching('fabric.mod.json') {
        expand version: mod_version
    }
}

shadowJar {
    configurations = [project.configurations.shade]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile

    manifest {
        attributes([
            "Specification-Title": "${archives_name}",
            "Specification-Vendor": "Zank",
            "Specification-Version": "${project.version}",
            "Implementation-Title": "${archives_name}",
            "Implementation-Version": "${project.version}",
            "Implementation-Vendor" :"Zank",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "Multi-Release": true,
        ])
    }
}

// see: https://github.com/firstdarkdev/modpublisher
publisher {
    validatedProp("publish.modrinth", "MODRINTH_TOKEN") { id, key ->
        modrinthID.set(id)
        apiKeys { modrinth(key) }
    }

    validatedProp("publish.curseforge", "CURSE_TOKEN") { id, key ->
        curseID.set(id)
        apiKeys { curseforge(key) }
    }

    validatedProp("publish.github", "GITHUB_TOKEN") { id, key ->
        githubRepo.set(id)
        apiKeys { github(key) }
    }

    // Enable Debug mode. When enabled, no files will actually be uploaded
    debug.set(false)

    changelog.set(rootProject.file("CHANGELOG.md"))
    projectVersion.set(mod_version)
    displayName.set("${mod_version} for Fabric")
    gameVersions.set(List.of("1.20.1", "1.21.1", "1.21.11", "26.1", "26.1.1", "26.1.2"))
    loaders.set(List.of("fabric"))
    artifact.set(tasks.remapJar)
}

void validatedProp(String prop, String env, BiConsumer<String, String> action) {
    String projectID = project.property(prop)
    String apiKey = System.getenv(env)
    if (projectID != null && !projectID.startsWith('[') && apiKey != null && !apiKey.empty) {
        action.accept(projectID, apiKey)
    }
}

// ---------------------------------------------------------------------------
// Multi-JDK test tasks
//
// `actions/setup-java` records every JDK it installs in ~/.m2/toolchains.xml
// (all versions of a multiline `java-version` input are included). Instead of
// running one CI job — and therefore one Gradle configuration + compilation —
// per JDK, read that file once and register one `Test` task per JDK.
//
// Every generated task reuses the already-compiled `test` source set and forks
// the JVM of the JDK recorded in the toolchains file. Using `executable`
// instead of a Gradle toolchain is required for GraalVM point releases:
// `25.4.4.1.1` and `25.3.4.1` both report "Java 25 + GraalVM" and therefore
// cannot be told apart by toolchain matching.
// ---------------------------------------------------------------------------
def toolchainsFile = file(System.getenv('MVN_TOOLCHAINS_FILE') ?: "${System.getProperty('user.home')}/.m2/toolchains.xml")

if (toolchainsFile.isFile()) {
    List<String> jdkTestTasks = []
    Set<String> seenJdkTasks = new HashSet<String>()

    def toolchains = new groovy.xml.XmlSlurper(false, false).parse(toolchainsFile)
    toolchains.toolchain.each { tc ->
        if (tc.type.text().trim() != 'jdk') {
            return
        }

        String version = tc.provides.version.text().trim()
        String vendor = tc.provides.vendor.text().trim()
        String jdkHome = tc.configuration.jdkHome.text().trim()
        if (!jdkHome) {
            return
        }

        // e.g. graalvm 25.4.4.1.1 -> testJdk_graalvm_25_4_4_1_1
        String suffix = "${vendor}_${version}".toString().replaceAll('[^A-Za-z0-9]+', '_')
        String taskName = "testJdk_${suffix}".toString()
        while (!seenJdkTasks.add(taskName)) {
            taskName = taskName + "_"
        }

        jdkTestTasks << taskName
        tasks.register(taskName, Test) {
            group = 'verification'
            description = "Runs fabric tests on ${vendor} ${version}".toString()
            testClassesDirs = project.sourceSets.test.output.classesDirs
            classpath = project.sourceSets.test.runtimeClasspath
            useJUnitPlatform()
            executable = new File(jdkHome, 'bin/java').absolutePath
        }
    }

    tasks.register('testAllJdks') {
        group = 'verification'
        description = 'Runs fabric tests on every JDK registered in ~/.m2/toolchains.xml'
        dependsOn(jdkTestTasks)

        doFirst {
            if (jdkTestTasks.isEmpty()) {
                throw new GradleException(
                    "No JDK toolchains found in ${toolchainsFile}. " +
                        "Install them with actions/setup-java (or set MVN_TOOLCHAINS_FILE) " +
                        "before running testAllJdks."
                )
            }
            logger.lifecycle("Running tests on ${jdkTestTasks.size()} JDK(s): " + jdkTestTasks.join(', '))
        }
    }
}