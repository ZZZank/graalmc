# Runs the fabric test suite across a variety of Java runtimes to catch issues
# that only appear on a specific JDK vendor, JVM implementation, or GraalVM
# release.
#
# Instead of one CI job (and one Gradle configuration + compilation) per JDK,
# every JDK is installed into a single job. `actions/setup-java` records all of
# them — including every version of a multiline `java-version` input — in
# `~/.m2/toolchains.xml`. The `:fabric:testAllJdks` Gradle task reads that file
# and creates one `Test` task per JDK, so compilation happens only once.
#
# Individual JDKs can still be run locally, e.g. `./gradlew :fabric:testJdkgraalvm_25_4_4_1_1`.

name: test
on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fabric tests (all JDKs)
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Default JDK used to run Gradle itself. It is installed last in this
      # multiline list, so `JAVA_HOME` / `PATH` point at temurin 21.
      - name: setup Java 17/21/25 (temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: setup Java 17/21/25 (zulu)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: |
            17
            21
            25
          set-default: false

      - name: setup Java 17/21/25 (dragonwell)
        uses: actions/setup-java@v6
        with:
          distribution: dragonwell
          java-version: |
            17
            21
            25
          set-default: false

      # Versions from https://www.graalvm.org/downloads/
      # reference: https://github.com/marketplace/actions/github-action-for-graalvm#options
      - name: setup GraalVM 25.x
        uses: actions/setup-java@v6
        with:
          distribution: graalvm
          java-version: |
            25.4
            25.3
            25.2
            25.1
          set-default: false

      - name: setup GraalVM Community 25.0.2
        uses: actions/setup-java@v6
        with:
          distribution: graalvm-community
          java-version: '25.0.2'
          set-default: false

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: print default JDK
        run: java -version

      - name: run tests on every installed JDK
        run: ./gradlew :fabric:testAllJdks --continue

      - name: upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-all-jdks
          path: |
            fabric/build/reports/tests/
            fabric/build/test-results/
          if-no-files-found: ignore
