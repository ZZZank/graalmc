# Runs the fabric test suite across a variety of Java runtimes to catch issues
# that only appear on a specific JDK vendor, JVM implementation, or GraalVM
# release.
#
# - `graalvm` job: tests compatibility with different Oracle GraalVM / GraalVM
#   Community releases (versions from https://www.graalvm.org/downloads/)
# - `jdk` job: representative non-GraalVM distributions across major versions
#
# Test code currently lives only in the `fabric` project, so every matrix entry
# runs `./gradlew :fabric:test`.

name: test
on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graalvm:
    name: GraalVM ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false
      matrix:
        include:
          - name: '25.4.4.1.1'
            distribution: graalvm
            java-version: '25.4.4.1.1'
          - name: '25.3.4.1'
            distribution: graalvm
            java-version: '25.3.4.1'
          - name: '25.2.4'
            distribution: graalvm
            java-version: '25.2.4'
          - name: '25.1.3'
            distribution: graalvm
            java-version: '25.1.3'
          - name: 'Community 25.0.2'
            distribution: graalvm-community
            java-version: '25.0.2'
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: setup Gradle wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: setup GraalVM ${{ matrix.name }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: ${{ matrix.distribution }}

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: print JDK info
        run: |
          java -version
          echo "GRAALVM_HOME=$GRAALVM_HOME"

      - name: run tests
        run: ./gradlew :fabric:test

      - name: upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.distribution }}-${{ matrix.java-version }}
          path: |
            fabric/build/reports/tests/
            fabric/build/test-results/
          if-no-files-found: ignore

  jdk:
    name: Java ${{ matrix.java-version }} (${{ matrix.distribution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21', '25']
        distribution: [temurin, zulu, dragonwell]
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: setup Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: setup Java ${{ matrix.java-version }} (${{ matrix.distribution }})
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: ${{ matrix.distribution }}

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: print JDK info
        run: java -version

      - name: run tests
        run: ./gradlew :fabric:test

      - name: upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.distribution }}-java${{ matrix.java-version }}
          path: |
            fabric/build/reports/tests/
            fabric/build/test-results/
          if-no-files-found: ignore
